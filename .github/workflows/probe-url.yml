name: probe-url
# Fetches URLs from the runner (the agent shell cannot reach most sites) and prints status, type and the start of the body.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "space-separated URLs"
        required: true
      bytes:
        description: "body bytes to print"
        default: "3000"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          for u in ${{ inputs.urls }}; do
            echo "=== $u"
            curl -sS -L -m 40 -A "RockID-probe/0.1 (https://github.com/marx1980/RockID)" -D /tmp/h -o /tmp/b "$u" || echo "curl failed"
            head -n 12 /tmp/h; echo "--- body (${{ inputs.bytes }} bytes of $(wc -c </tmp/b))"
            head -c ${{ inputs.bytes }} /tmp/b; echo
          done
