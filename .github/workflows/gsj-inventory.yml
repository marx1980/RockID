name: gsj-inventory
# Lists the Geological Survey of Japan specimen records (IIIF manifests only, no images) with licence and label.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m services.ingestion.gsj_inventory /tmp/gsj_inventory.csv
      - name: Commit CSV to a results branch
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan gsj/inventory-${{ github.run_id }}
          git rm -rf . -q; mkdir -p results/gsj; cp /tmp/gsj_inventory.csv results/gsj/inventory.csv
          git add results/gsj/inventory.csv; git commit -q -m "GSJ inventory"; git push -q origin HEAD
