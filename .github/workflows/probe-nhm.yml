name: probe-nhm
on:
  workflow_dispatch:
    inputs:
      script:
        default: "tools/probe/nhm_probe.py"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe
        env:
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
        run: mkdir -p probe-out && python ${{ inputs.script }} probe-out/nhm.json
      - name: Push the dump to a temporary branch
        run: |
          git config user.name "rockid-probe"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "probe/run-${{ github.run_id }}"
          git add -f probe-out
          git commit -m "NHM probe (run ${{ github.run_id }})"
          git push origin "probe/run-${{ github.run_id }}"
