name: private-source
# MineralImage5k photos are museum photos kept private: this workflow downloads them, never commits them.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect"
        default: "inspect"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt datasets
      - name: Inspect
        run: python -m services.ingestion.private_mineralimage5k inspect
