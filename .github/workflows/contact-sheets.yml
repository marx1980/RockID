name: contact-sheets
on:
  workflow_dispatch:
    inputs:
      round_prefix:
        description: "sheet name prefix for a later review round (blank = first round); already-reviewed candidates are skipped when set"
        default: ""
      only_source:
        description: "only candidates whose source name contains this text (e.g. Wikimedia)"
        default: ""

permissions:
  contents: write

jobs:
  sheets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          if [ -n "${{ inputs.round_prefix }}" ]; then
            python -m services.curation.contact_sheet data_manifests/candidates/candidates.csv sheets \
              --skip-reviewed data_manifests/candidates/agent_review.csv --prefix "${{ inputs.round_prefix }}" --only-source "${{ inputs.only_source }}"
          else
            python -m services.curation.contact_sheet data_manifests/candidates/candidates.csv sheets
          fi
      - name: Push to a temporary review branch (delete after review)
        run: |
          git config user.name "rockid-curation"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan "curation/sheets-${{ github.run_id }}"
          git rm -rq --cached .
          git add sheets
          git commit -qm "Contact sheets (run ${{ github.run_id }})"
          git push origin "curation/sheets-${{ github.run_id }}"
