name: contact-sheets
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sheets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m services.curation.contact_sheet data_manifests/candidates/candidates.csv sheets
      - name: Push to a temporary review branch (delete after review)
        run: |
          git config user.name "rockid-curation"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan "curation/sheets-${{ github.run_id }}"
          git rm -rq --cached .
          git add sheets
          git commit -qm "Contact sheets (run ${{ github.run_id }})"
          git push origin "curation/sheets-${{ github.run_id }}"
