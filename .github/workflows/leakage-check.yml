name: leakage-check
# Fingerprints the challenge images (sets A and B) and compares them with the reference set.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: vault
          path: vault
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check
        run: |
          mkdir -p results
          python -m services.curation.challenge_leakage data_manifests/reference/reference.csv results/leakage_check.json vault/challenge.csv vault/challenge_b.csv | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Push to a branch
        run: |
          git config user.name "rockid-check"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "check/leakage-${{ github.run_id }}"
          git add -f results/leakage_check.json results/leakage_pairs
          git commit -m "Leakage check (run ${{ github.run_id }})"
          git push origin "check/leakage-${{ github.run_id }}"
