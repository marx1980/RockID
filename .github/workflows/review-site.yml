name: review-site
on:
  push:
    branches: [main]
    paths:
      - app/**
      - index.html
      - apps/review/**
      - services/review/**
      - packages/taxonomy/**
      - data_manifests/candidates/candidates.csv
      - .github/workflows/review-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          # one site: the identify app at /app/, the review page at /review/, a redirect at the root
          python -m services.review.build_site data_manifests/candidates/candidates.csv site/review data_manifests/candidates/decisions.json
          cp -r app site/app
          cp index.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
