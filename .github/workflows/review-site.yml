name: review-site
on:
  push:
    branches: [main]
    paths:
      - apps/review/**
      - services/review/**
      - packages/taxonomy/**
      - data_manifests/candidates/candidates.csv
      - .github/workflows/review-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m services.review.build_site data_manifests/candidates/candidates.csv site
          mkdir -p site/review && cp site/index.html site/candidates.json site/taxa.json site/review/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
